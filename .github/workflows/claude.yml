name: Claude Code

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    name: Run Claude Code
    if: |
      github.event.sender.type != 'Bot' && (
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    env:
      # Route the trigger to exactly one step. Each event carries the trigger text
      # in a different payload field, and only one of them is ever populated.
      # A PR conversation comment arrives as issue_comment, so PR detection has to
      # test github.event.issue.pull_request, not the event name alone.
      MODE: >-
        ${{
        (github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null))
        && contains(github.event.review.body || github.event.comment.body, '@claude review') && 'review'
        || (github.event_name == 'issues' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null))
        && (contains(github.event.comment.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude fix') && 'fix'
        || contains(github.event.comment.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude verify') && 'verify')
        || 'general'
        }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the verify step can check whether a later commit already
          # fixed the reported bug. The PR path deepens a shallow clone on its own.
          fetch-depth: 0

      - name: Run Claude Code (PR review)
        uses: anthropics/claude-code-action@v1
        id: claude_review
        if: env.MODE == 'review'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Run Claude Code (Issue verify)
        uses: anthropics/claude-code-action@v1
        id: claude_verify
        if: env.MODE == 'verify'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read the code on nightly. Fixes land there first, so master would show a
          # bug as unfixed after it was already resolved.
          base_branch: nightly
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Tautulli is a Python/CherryPy application that monitors Plex Media Server.
            This tracker takes bug reports and feature requests only. Support questions
            belong on Discord: https://tautulli.com/discord

            Verify this bug report:
            - Name any required template field left blank. Those are Tautulli version,
              git branch, commit hash, platform, Python version, browser, and the logs link.
            - Search open and closed issues for a duplicate and link it.
            - Say which this is: bug, feature request, or support question.
            - Read the code and name the file and function that produces the reported
              behavior. Quote the lines that matter.
            - Say whether the report still reproduces on nightly, or whether a later
              commit already fixed it. The reporter's commit hash is in the template.
            - If it is a real bug, propose the fix as a diff in your comment.

            Do not commit, push a branch, or open a pull request. Do not add, remove, or
            change labels, and do not close the issue. A maintainer acts on your findings.

            End with one line: a maintainer can comment "@claude fix" to turn your diff
            into a draft pull request.
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search issues:*)"

      - name: Run Claude Code (Issue fix)
        uses: anthropics/claude-code-action@v1
        id: claude_fix
        if: env.MODE == 'fix'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CONTRIBUTING.md: every pull request is based on nightly. The action fetches
          # and checks out this branch before it creates the working branch.
          base_branch: nightly
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Implement the fix for this issue, then open a draft pull request.

            - Fix the cause, not the symptom. Grep every caller of a function you change.
            - Keep the change as small as the bug allows. Match the surrounding style.
            - Commit and push, then run `gh pr create --draft --base nightly`.
            - Write the PR body against .github/PULL_REQUEST_TEMPLATE.md. Keep its
              headings and put `- Fixes #<issue number>` under Description.
            - Add this line under Description: "AI Disclosure: Claude Code generated this
              branch from the issue report. A maintainer reviews and tests it before it
              leaves draft."
            - Leave "How Has This Been Tested?" empty and every checklist box unchecked.
              Those belong to the maintainer who reviews the branch.

            Stop and report instead if the cause is unclear or the fix spans more than a
            few files. Say what you found and what you would change.
          claude_args: |
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*)"

      - name: Run Claude Code (General)
        uses: anthropics/claude-code-action@v1
        id: claude
        if: env.MODE == 'general'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
