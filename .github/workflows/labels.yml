name: Label Issues / PRs

on:
  issues:
    types: [labeled, unlabeled]
  pull_request:
    types: [labeled, unlabeled]

jobs:
  label:
    name: Label Issues / PRs
    runs-on: ubuntu-latest
    steps:
      - name: Label
        uses: dessant/label-actions@v5
        with:
          github-token: ${{ github.token }}
