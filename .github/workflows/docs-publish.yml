name: Publish Docs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'website/**'
      # generate-docs.py builds the API reference and the Exporter Guide field tables from these files.
      - 'plexpy/api2.py'
      - 'plexpy/exporter.py'
      - 'plexpy/webserve.py'
      - '.github/workflows/docs-publish.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    # A push deploys only where GitHub Pages is turned on, so forks without Pages skip it.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.has_pages
    permissions:
      contents: read
      # configure-pages reads the Pages settings.
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Dependencies
        run: npm ci

      # Repo variables win. Otherwise the URL comes from the Pages settings.
      # That gives https://docs.tautulli.com with a custom domain and
      # https://<owner>.github.io/Tautulli/ without one.
      - name: Build Site
        run: npm run build
        env:
          DOCS_URL: ${{ vars.DOCS_URL || steps.pages.outputs.origin }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL || format('{0}/', steps.pages.outputs.base_path) }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy-docs:
    name: Deploy Docs
    needs: build-docs
    runs-on: ubuntu-latest
    # Only the deploy job gets these. The build job runs npm packages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
